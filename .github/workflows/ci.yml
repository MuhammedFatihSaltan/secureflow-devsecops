name: SecureFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Ortamı ve Birim Testleri
    runs-on: ubuntu-latest

    steps:
      - name: Depo kodunu indir
        uses: actions/checkout@v4

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Birim testlerini çalıştır (pytest)
        env:
          PYTHONPATH: src
        run: pytest -v