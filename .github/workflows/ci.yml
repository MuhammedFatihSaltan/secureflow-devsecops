name: SecureFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Taraması
    runs-on: ubuntu-latest

    steps:
      - name: Depo kodunu ve geçmişini indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks ile gizli bilgi taraması yap
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-tests:
    name: Python Ortamı ve Birim Testleri
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Depo kodunu indir
        uses: actions/checkout@v4

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları hash doğrulaması ile yükle
        run: "pip install --only-binary=:all: --require-hashes -r requirements.txt"

      - name: Birim testlerini ve kapsama analizini çalıştır
        env:
          PYTHONPATH: src
        run: pytest -v --cov=secureflow --cov-report=xml

      - name: Kapsama raporunu sonraki adıma aktar
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarqube-scan:
    name: SonarQube Cloud SAST ve Quality Gate
    runs-on: ubuntu-latest
    needs: python-tests

    steps:
      - name: Depo kodunu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kapsama raporunu indir
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Cloud Analizi ve Quality Gate Kontrolü
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy-scan:
    name: Trivy Konteyner ve Bağımlılık Güvenlik Taraması
    runs-on: ubuntu-latest
    needs: sonarqube-scan

    steps:
      - name: Depo kodunu indir
        uses: actions/checkout@v4

      - name: Dosya sistemi ve Dockerfile yapılandırma taraması
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,misconfig"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Docker imajını derle
        run: docker build -t secureflow:ci .

      - name: Docker imajı zafiyet taraması
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "secureflow:ci"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true