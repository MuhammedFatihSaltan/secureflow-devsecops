name: SecureFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Taraması
    runs-on: ubuntu-latest

    steps:
      - name: Depo kodunu ve geçmişini indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks ile gizli bilgi taraması yap
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-tests:
    name: Python Ortamı ve Birim Testleri
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Depo kodunu indir
        uses: actions/checkout@v4

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: "pip install --only-binary :all: -r requirements.txt"

      - name: Birim testlerini ve kapsama analizini çalıştır
        env:
          PYTHONPATH: src
        run: pytest -v --cov=secureflow --cov-report=xml

      - name: Kapsama raporunu sonraki adıma aktar
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarqube-scan:
    name: SonarQube Cloud SAST ve Quality Gate
    runs-on: ubuntu-latest
    needs: python-tests

    steps:
      - name: Depo kodunu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kapsama raporunu indir
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Cloud Analizi ve Quality Gate Kontrolü
        uses: SonarSource/sonarqube-scan-action@221b54ef095b12679e83892978d4bf7a801e2063 # v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}